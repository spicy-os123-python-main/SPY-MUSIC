name: Build SPY MUSIC iOS (.ipa)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to attach .ipa to'
        required: false
        default: 'v1.0.0'

jobs:
  build-ipa:
    name: Build iOS IPA for AltStore
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Patch audiotags for iOS
        run: |
          python3 -c "
          import glob, os, urllib.request, zipfile
          podspecs = glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/audiotags-*/ios/audiotags.podspec'))
          for p in podspecs:
              print('Found audiotags podspec:', p)
              with open(p, 'r') as fp:
                  c = fp.read()
              c = c.replace('[ ! -d ios.zip ]d', '[ ! -f ios.zip ]')
              with open(p, 'w') as fp:
                  fp.write(c)
              frameworks_dir = os.path.join(os.path.dirname(p), 'Frameworks')
              os.makedirs(frameworks_dir, exist_ok=True)
              zip_path = os.path.join(frameworks_dir, 'ios.zip')
              if not os.path.exists(zip_path):
                  print('Downloading audiotags iOS framework...')
                  urllib.request.urlretrieve('https://github.com/erikas-taroza/audiotags/releases/download/v1.4.2/ios.zip', zip_path)
              dest = os.path.join(frameworks_dir, 'audiotags.xcframework')
              if not os.path.exists(dest):
                  print('Extracting audiotags.xcframework...')
                  with zipfile.ZipFile(zip_path, 'r') as zip_ref:
                      os.makedirs(dest, exist_ok=True)
                      zip_ref.extractall(dest)
                  print('Extracted audiotags.xcframework to', dest)
          "

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Application (Release, No CodeSign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package into IPA for AltStore / Sideloading
        run: |
          mkdir -p output/Payload
          cp -r build/ios/iphoneos/Runner.app output/Payload/
          cd output
          zip -r -y SPY-MUSIC.ipa Payload
          rm -rf Payload
          ls -lh SPY-MUSIC.ipa
          cd ..

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spymusic-ipa
          path: output/SPY-MUSIC.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.0' }}
          files: output/SPY-MUSIC.ipa
          name: "SPY MUSIC v1.0.0"
          make_latest: true

