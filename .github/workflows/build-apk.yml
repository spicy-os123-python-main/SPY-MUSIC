name: Build SPY MUSIC APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Patch media_kit_video for Flutter compatibility
        run: |
          python3 -c "
          import glob
          files = glob.glob('/home/runner/.pub-cache/hosted/pub.dev/media_kit_video-*/android/src/main/java/com/alexmercerind/media_kit_video/VideoOutput.java')
          for f in files:
              with open(f, 'r') as fp:
                  content = fp.read()
              content = content.replace('@Override\n    public void onSurfaceAvailable()', 'public void onSurfaceCreated() { onSurfaceAvailable(); }\n    public void onSurfaceDestroyed() { onSurfaceCleanup(); }\n    public void onSurfaceAvailable()')
              content = content.replace('@Override\n    public void onSurfaceCleanup()', 'public void onSurfaceCleanup()')
              with open(f, 'w') as fp:
                  fp.write(content)
              print('Successfully patched', f)
          "

      - name: Build Android APKs (Release & Split)
        run: |
          flutter build apk --release
          flutter build apk --split-per-abi --release

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/spymusic.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output/spymusic-arm64-v8a.apk || true
          ls -lh output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spymusic-apk
          path: output/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: v1.0.0
          files: output/*.apk
          name: "SPY MUSIC v1.0.0 (Android APK)"
          generate_release_notes: true
          make_latest: true
