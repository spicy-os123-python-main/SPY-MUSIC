name: Build SPY MUSIC APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.2'
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Android APK (Release)
        run: |
          flutter build apk --release --split-per-abi || flutter build apk --release

      - name: Find and Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/*.apk output/ || cp build/app/outputs/apk/release/*.apk output/
          ls -la output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPY-MUSIC-Android-APK
          path: output/*.apk
          retention-days: 30

      - name: Release APK (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          name: "SPY MUSIC ${{ github.ref_name }}"
          generate_release_notes: true
